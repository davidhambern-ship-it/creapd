name: Build CREAPD OBS Bridge

on:
  workflow_dispatch:
  push:
    branches:
      - backend/vercel-foundation
    paths:
      - 'bridge/windows/CREAPDBridge/**'
      - '.github/workflows/build-creapd-obs-bridge.yml'

permissions:
  contents: read
  id-token: write

jobs:
  windows-bridge:
    name: Windows x64 bridge
    runs-on: windows-latest
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
      MS_STORE_IDENTITY_NAME: ${{ secrets.MS_STORE_IDENTITY_NAME }}
      MS_STORE_PUBLISHER: ${{ secrets.MS_STORE_PUBLISHER }}
      MS_STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.MS_STORE_PUBLISHER_DISPLAY_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore bridge/windows/CREAPDBridge/CREAPDBridge.csproj

      - name: Publish single-file bridge
        run: >
          dotnet publish bridge/windows/CREAPDBridge/CREAPDBridge.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishTrimmed=false
          --output bridge-dist

      - name: Detect Artifact Signing configuration
        id: signing
        shell: pwsh
        run: |
          $required = @(
            $env:AZURE_CLIENT_ID,
            $env:AZURE_TENANT_ID,
            $env:AZURE_SUBSCRIPTION_ID,
            $env:ARTIFACT_SIGNING_ENDPOINT,
            $env:ARTIFACT_SIGNING_ACCOUNT,
            $env:ARTIFACT_SIGNING_PROFILE
          )
          $configured = -not ($required | Where-Object { [string]::IsNullOrWhiteSpace($_) })
          "configured=$($configured.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($configured) {
            Write-Host "Azure Artifact Signing configuration detected."
          } else {
            Write-Warning "Artifact Signing is not configured. This run will produce an UNSIGNED developer artifact."
          }

      - name: Azure login for Artifact Signing
        if: steps.signing.outputs.configured == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign CREAPD Bridge with Azure Artifact Signing
        if: steps.signing.outputs.configured == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\bridge-dist\CREAPDBridge.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: CREAPD OBS Bridge
          description-url: https://creapd.com

      - name: Verify Authenticode signature
        if: steps.signing.outputs.configured == 'true'
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE 'bridge-dist\CREAPDBridge.exe'
          $signature = Get-AuthenticodeSignature -FilePath $path
          $signature | Format-List Status, StatusMessage, SignerCertificate, TimeStamperCertificate
          if ($signature.Status -ne 'Valid') {
            throw "CREAPDBridge.exe signature verification failed: $($signature.Status) — $($signature.StatusMessage)"
          }

      - name: Detect Microsoft Store identity
        id: store
        shell: pwsh
        run: |
          $configured = -not (
            [string]::IsNullOrWhiteSpace($env:MS_STORE_IDENTITY_NAME) -or
            [string]::IsNullOrWhiteSpace($env:MS_STORE_PUBLISHER)
          )
          "configured=$($configured.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if ($configured) {
            Write-Host "Microsoft Store package identity detected."
          } else {
            Write-Warning "Store identity is not configured. Building an unsigned development MSIX template only."
          }

      - name: Build MSIX package
        shell: pwsh
        run: |
          $identity = if ([string]::IsNullOrWhiteSpace($env:MS_STORE_IDENTITY_NAME)) {
            "CREAPD.OBSBridge.Dev"
          } else {
            $env:MS_STORE_IDENTITY_NAME
          }

          $publisher = if ([string]::IsNullOrWhiteSpace($env:MS_STORE_PUBLISHER)) {
            "CN=CREAPD Development, OID.2.25.311729368913984317654407730594956997722=1"
          } else {
            $env:MS_STORE_PUBLISHER
          }

          $publisherDisplay = if ([string]::IsNullOrWhiteSpace($env:MS_STORE_PUBLISHER_DISPLAY_NAME)) {
            "CREAPD"
          } else {
            $env:MS_STORE_PUBLISHER_DISPLAY_NAME
          }

          ./bridge/windows/msix/package-msix.ps1 `
            -PublishedExe "./bridge-dist/CREAPDBridge.exe" `
            -OutputMsix "./bridge-dist/CREAPD-OBS-Bridge-v0.3.0.msix" `
            -IdentityName $identity `
            -Publisher $publisher `
            -PublisherDisplayName $publisherDisplay

      - name: Show output
        shell: pwsh
        run: Get-ChildItem -Path bridge-dist -Recurse | Format-Table FullName, Length

      - name: Upload signed Windows bridge
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CREAPD-OBS-Bridge-Windows-x64-SIGNED
          path: |
            bridge-dist/CREAPDBridge.exe
            bridge/windows/CREAPDBridge/README.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned developer bridge
        if: steps.signing.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CREAPD-OBS-Bridge-Windows-x64-UNSIGNED-DEV
          path: |
            bridge-dist/CREAPDBridge.exe
            bridge/windows/CREAPDBridge/README.md
          if-no-files-found: error
          retention-days: 14

      - name: Upload Store submission MSIX
        if: steps.store.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CREAPD-OBS-Bridge-MSIX-STORE-SUBMISSION
          path: bridge-dist/CREAPD-OBS-Bridge-v0.3.0.msix
          if-no-files-found: error
          retention-days: 30

      - name: Upload development MSIX template
        if: steps.store.outputs.configured != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CREAPD-OBS-Bridge-MSIX-UNSIGNED-DEV
          path: bridge-dist/CREAPD-OBS-Bridge-v0.3.0.msix
          if-no-files-found: error
          retention-days: 14
