name: Sync CREAPD Preview Lockfile

on:
  push:
    branches:
      - backend/vercel-foundation

permissions:
  contents: write

jobs:
  sync-lock:
    if: ${{ !contains(github.event.head_commit.message, '[lock-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backend/vercel-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh package lock
        run: npm install --package-lock-only --legacy-peer-deps
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already in sync"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync CREAPD Preview package lock [lock-sync]"
          git push origin HEAD:backend/vercel-foundation
